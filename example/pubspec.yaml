name: "example_for_generator"
description: example
version: 0.0.1
homepage: https://github.com

environment: 
  sdk: ">=2.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_asset_encrypt:
    path: ../

flutter:
  assets:
    - images/
    - assets/

  uses-material-design: true
  generate: true

  fonts:
    - family: EditorIcons
      fonts:
        - asset: assets/editor/fonts/editor-icons.otf
